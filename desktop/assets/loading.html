<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file:" />
    <title>Streamora</title>
    <style>
      html, body { height: 100%; margin: 0; background: #141414; }
      body { display: grid; place-content: center; justify-items: center; gap: 28px; }
      img { width: 96px; height: 96px; border-radius: 20px; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgb(255 255 255 / 15%); border-top-color: #e5383b;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="Streamora" />
    <div class="spinner" role="status" aria-label="Starting"></div>
  </body>
</html>
